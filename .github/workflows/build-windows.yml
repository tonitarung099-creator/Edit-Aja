      - name: Upload Edit Aja artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Edit-Aja-Windows-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

          }) -join ';'

          New-Item -ItemType Directory -Force "$env:CRAFT_ROOT\download" | Out-Null
          $bootstrap = "$env:CRAFT_ROOT\download\CraftBootstrap.py"
          Invoke-WebRequest https://raw.githubusercontent.com/KDE/craft/master/setup/CraftBootstrap.py -OutFile $bootstrap

          # Upstream's unattended Windows default is MSVC. Kdenlive's own build
          # documentation recommends MinGW, so make MinGW the unattended default.
          python -c "from pathlib import Path; p=Path(r'$bootstrap'); s=p.read_text(); old='            ],\n            (\"msvc2022\", \"cl\"),\n            returnDefaultWithoutPrompt=args.use_defaults,'; new='            ],\n            (None, \"gcc\"),\n            returnDefaultWithoutPrompt=args.use_defaults,'; assert old in s; p.write_text(s.replace(old,new,1))"
          python $bootstrap --prefix $env:CRAFT_ROOT --branch master --use-defaults

          $cfg = Join-Path $env:CRAFT_ROOT 'etc\CraftSettings.ini'
          if (-not (Test-Path $cfg)) { throw "Craft settings not found: $cfg" }
          $text = Get-Content $cfg -Raw
          $text = [regex]::Replace($text, '(?m)^ABI\s*=.*
