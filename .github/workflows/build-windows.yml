name: Build Edit Aja for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edit-aja-windows
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      UPSTREAM_COMMIT: c3d8a38c04470f6726b21485fc488f2cd2921654
      PHASE5_SHA256: 682be7bcb5afd875eb5f347ecd8f644be5fa1273e175c027ddd1d67491ac9a65
      CRAFT_ROOT: C:\CraftRoot
      CRAFT_BUILD_TYPE: RelWithDebInfo

    steps:
      - name: Checkout Edit Aja build repository
        uses: actions/checkout@v4

      - name: Reassemble and verify Phase 5 patch
        shell: pwsh
        run: |
          python -c "import base64,bz2,hashlib,pathlib; p=pathlib.Path('patches'); n=['00','01','02','03','04.00','04.01','04.02','05.00','05.01','05.02']; s=''.join((p/f'phase5.patch.bz2.b64.{x}').read_text() for x in n); out=bz2.decompress(base64.b64decode(s)); h=hashlib.sha256(out).hexdigest(); print('Phase 5 SHA-256:',h); assert h=='$env:PHASE5_SHA256'; pathlib.Path('craft/editaja/phase5.patch').write_bytes(out)"
          Copy-Item patches/build-fixes.patch craft/editaja/build-fixes.patch -Force
          Copy-Item branding/editaja-logo.png.b64 craft/editaja/editaja-logo.png.b64 -Force
          Copy-Item scripts/apply_branding.py craft/editaja/apply_branding.txt -Force

      - name: Reconstruct and verify corresponding source
        id: corresponding_source
        shell: pwsh
        run: |
          # PowerShell otherwise continues after a failed native git/python command.
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force corresponding-source | Out-Null
          git -C corresponding-source init
          git -C corresponding-source remote add origin https://github.com/KDE/kdenlive.git
          git -C corresponding-source fetch --depth 1 origin $env:UPSTREAM_COMMIT
          git -C corresponding-source checkout --detach FETCH_HEAD
          git -C corresponding-source apply --ignore-space-change -p2 "$env:GITHUB_WORKSPACE\craft\editaja\phase5.patch"
          git -C corresponding-source apply --check "$env:GITHUB_WORKSPACE\patches\build-fixes.patch"
          git -C corresponding-source apply "$env:GITHUB_WORKSPACE\patches\build-fixes.patch"
          python scripts/apply_branding.py corresponding-source --assets branding
          if (-not (Select-String -Path corresponding-source/src/main.cpp -Pattern 'i18n\("Edit Aja"\)' -Quiet)) {
            throw 'Edit Aja branding verification failed'
          }
          if (-not (Test-Path corresponding-source/src/aiassistant/aiassistantwidget.cpp)) {
            throw 'Phase 5 AI assistant source is missing'
          }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Remove-Item -Recurse -Force corresponding-source/.git
          Compress-Archive -Path corresponding-source/* -DestinationPath artifacts/Edit-Aja-Source.zip -CompressionLevel Optimal

      - name: Bootstrap KDE Craft with MinGW-w64
        shell: pwsh
        run: |
          # Kdenlive's current build documentation recommends MinGW on Windows.
          # Avoid Git-for-Windows POSIX tools leaking into Craft's own MSYS environment.
          $pathParts = $env:PATH -split ';' | Where-Object {
            $_ -and
            $_ -notmatch '(?i)\\Git\\bin$' -and
            $_ -notmatch '(?i)\\Git\\usr\\bin$'
          }
          $env:PATH = ($pathParts -join ';')

          New-Item -ItemType Directory -Force "$env:CRAFT_ROOT\download" | Out-Null
          $bootstrap = "$env:CRAFT_ROOT\download\CraftBootstrap.py"
          Invoke-WebRequest https://raw.githubusercontent.com/KDE/craft/master/setup/CraftBootstrap.py -OutFile $bootstrap

          # CraftBootstrap defaults to MSVC when --use-defaults is used.
          # Patch only that default choice so CI selects the Kdenlive-recommended MinGW compiler.
          $bootstrapText = Get-Content $bootstrap -Raw
          $pattern = '\],\s*\("msvc2022",\s*"cl"\),\s*returnDefaultWithoutPrompt=args\.use_defaults'
          $replacement = "],`n            (None, `"gcc`"),`n            returnDefaultWithoutPrompt=args.use_defaults"
          $patchedText = [regex]::Replace($bootstrapText, $pattern, $replacement, 1)
          if ($patchedText -eq $bootstrapText) {
            throw 'Unable to select MinGW in CraftBootstrap.py'
          }
          Set-Content -Path $bootstrap -Value $patchedText -Encoding UTF8

          python $bootstrap --prefix $env:CRAFT_ROOT --branch master --use-defaults
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $cfg = Join-Path $env:CRAFT_ROOT 'etc\CraftSettings.ini'
          if (-not (Test-Path $cfg)) { throw "Craft settings not found: $cfg" }

          $text = Get-Content $cfg -Raw
          $text = [regex]::Replace($text, '(?m)^ABI\s*=.*$', 'ABI = windows-gcc-x86_64')
          $text = [regex]::Replace($text, '(?m)^BuildType\s*=.*$', 'BuildType = RelWithDebInfo')
          Set-Content -Path $cfg -Value $text -Encoding UTF8

          Get-Content $cfg | Select-String 'ABI|BuildType|MakeProgram|CacheVersion|RepositoryUrl'

      - name: Verify KDE Craft MinGW configuration
        shell: pwsh
        run: |
          $cfg = Join-Path $env:CRAFT_ROOT 'etc\CraftSettings.ini'
          $text = Get-Content $cfg -Raw
          if ($text -notmatch '(?m)^ABI\s*=\s*windows-gcc-x86_64\s*$') {
            throw 'Craft did not initialize with the MinGW x86_64 ABI'
          }
          if ($text -notmatch '(?m)^BuildType\s*=\s*RelWithDebInfo\s*$') {
            throw 'Craft BuildType is not RelWithDebInfo'
          }
          Write-Host 'Craft MinGW configuration verified.'
      - name: Install Edit Aja Craft blueprint
        shell: pwsh
        run: |
          $kdenliveFile = Get-ChildItem "$env:CRAFT_ROOT" -File -Recurse -Filter kdenlive.py -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Directory.Name -eq 'kdenlive' -and
              $_.Directory.Parent -and
              $_.Directory.Parent.Name -eq 'kdemultimedia'
            } |
            Select-Object -First 1
          if (-not $kdenliveFile) { throw 'Could not locate the Kdenlive Craft blueprint' }
          $target = Join-Path $kdenliveFile.Directory.Parent.FullName 'editaja'
          New-Item -ItemType Directory -Force $target | Out-Null
          Copy-Item craft/editaja/* $target -Recurse -Force
          Write-Host "Edit Aja blueprint: $target"
          Get-ChildItem $target

      - name: Install dependencies from KDE binary cache
        shell: pwsh
        run: |
          $setup = ConvertFrom-Json (& python "$env:CRAFT_ROOT\craft\bin\CraftSetupHelper.py" --setup --format=json)
          foreach ($property in $setup.PSObject.Properties) {
            Set-Item -Force -Path "Env:$($property.Name)" -Value "$($property.Value)"
          }
          $craft = "$env:CRAFT_ROOT\craft\bin\craft.py"
          python $craft --ci-mode --buildtype $env:CRAFT_BUILD_TYPE --use-cache --install-deps kde/kdemultimedia/editaja
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Edit Aja only
        shell: pwsh
        run: |
          $setup = ConvertFrom-Json (& python "$env:CRAFT_ROOT\craft\bin\CraftSetupHelper.py" --setup --format=json)
          foreach ($property in $setup.PSObject.Properties) {
            Set-Item -Force -Path "Env:$($property.Name)" -Value "$($property.Value)"
          }
          $craft = "$env:CRAFT_ROOT\craft\bin\craft.py"

          # Dependencies were installed above from KDE's binary cache.
          # --no-cache here intentionally builds our modified Edit Aja source.
          python $craft --ci-mode --buildtype $env:CRAFT_BUILD_TYPE --no-cache kde/kdemultimedia/editaja
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Windows packager
        shell: pwsh
        run: |
          $setup = ConvertFrom-Json (& python "$env:CRAFT_ROOT\craft\bin\CraftSetupHelper.py" --setup --format=json)
          foreach ($property in $setup.PSObject.Properties) {
            Set-Item -Force -Path "Env:$($property.Name)" -Value "$($property.Value)"
          }
          $craft = "$env:CRAFT_ROOT\craft\bin\craft.py"
          python $craft --ci-mode --buildtype $env:CRAFT_BUILD_TYPE --use-cache --update nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Edit Aja for Windows
        shell: pwsh
        run: |
          $setup = ConvertFrom-Json (& python "$env:CRAFT_ROOT\craft\bin\CraftSetupHelper.py" --setup --format=json)
          foreach ($property in $setup.PSObject.Properties) {
            Set-Item -Force -Path "Env:$($property.Name)" -Value "$($property.Value)"
          }
          $craft = "$env:CRAFT_ROOT\craft\bin\craft.py"
          python $craft --ci-mode --buildtype $env:CRAFT_BUILD_TYPE --package kde/kdemultimedia/editaja
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect Windows package
        id: windows_package
        shell: pwsh
        run: |
          # Run only after a successful build and package step. Keep source
          # archives out of the directory published as the Windows application.
          New-Item -ItemType Directory -Force artifacts/windows | Out-Null
          $binaryCount = 0

          if (Test-Path "$env:CRAFT_ROOT\craft\bin\craft.py") {
            $setup = ConvertFrom-Json (& python "$env:CRAFT_ROOT\craft\bin\CraftSetupHelper.py" --setup --format=json)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            foreach ($property in $setup.PSObject.Properties) {
              Set-Item -Force -Path "Env:$($property.Name)" -Value "$($property.Value)"
            }
            $craft = "$env:CRAFT_ROOT\craft\bin\craft.py"
            $packageDirOutput = & python $craft --ci-mode --buildtype $env:CRAFT_BUILD_TYPE -q --get "packageDestinationDir()" virtual/base 2>$null
            # An empty query result must still allow the fallback search below.
            $packageDir = "$($packageDirOutput | Select-Object -Last 1)".Trim()

            if ($packageDir -and (Test-Path $packageDir)) {
              Write-Host "Craft package directory: $packageDir"
              $packages = Get-ChildItem $packageDir -Recurse -File -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.Extension -in '.exe','.zip','.7z','.sha256' -and
                  ($_.Name -match 'edit.?aja' -or $_.Name -match 'editaja')
                }
              foreach ($p in $packages) {
                Copy-Item $p.FullName (Join-Path 'artifacts/windows' $p.Name) -Force
                if ($p.Extension -in '.exe','.zip','.7z') { $binaryCount++ }
              }
            }
          }

          # Fallback search in case Craft changes its package destination layout.
          if ($binaryCount -eq 0 -and (Test-Path $env:CRAFT_ROOT)) {
            $packages = Get-ChildItem $env:CRAFT_ROOT -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Extension -in '.exe','.zip','.7z' -and
                ($_.Name -match 'edit.?aja' -or $_.Name -match 'editaja')
              } |
              Select-Object -First 10
            foreach ($p in $packages) {
              Copy-Item $p.FullName (Join-Path 'artifacts/windows' $p.Name) -Force
              $binaryCount++
            }
          }

          Get-ChildItem artifacts/windows -File | Format-Table Name, Length
          if ($binaryCount -eq 0) {
            throw 'No runnable Edit Aja Windows package was produced.'
          }
          # A successful fallback supersedes the optional directory query's
          # exit code, which the Actions PowerShell wrapper otherwise reuses.
          $global:LASTEXITCODE = 0

      - name: Upload Edit Aja Windows package
        if: ${{ success() && steps.windows_package.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: Edit-Aja-Windows-x64
          path: artifacts/windows/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload verified corresponding source
        if: ${{ always() && steps.corresponding_source.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: Edit-Aja-Source
          path: artifacts/Edit-Aja-Source.zip
          if-no-files-found: error
          retention-days: 14
