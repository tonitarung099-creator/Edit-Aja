name: Build Edit Aja for Windows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-windows.yml'
      - 'patches/**'
      - 'branding/**'
      - 'scripts/**'
      - 'craft/**'
      - 'README.md'
      - 'BUILDING.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      UPSTREAM_COMMIT: c3d8a38c04470f6726b21485fc488f2cd2921654
      PHASE5_SHA256: 682be7bcb5afd875eb5f347ecd8f644be5fa1273e175c027ddd1d67491ac9a65
      CRAFT_ROOT: C:\CraftRoot

    steps:
      - name: Checkout Edit Aja build repository
        uses: actions/checkout@v4

      - name: Reassemble and verify Phase 5 patch
        shell: pwsh
        run: |
          python -c "import base64,bz2,hashlib,pathlib; p=pathlib.Path('patches'); s=''.join(x.read_text() for x in sorted(p.glob('phase5.patch.bz2.b64.*'))); out=bz2.decompress(base64.b64decode(s)); h=hashlib.sha256(out).hexdigest(); print('Phase 5 SHA-256:',h); assert h=='$env:PHASE5_SHA256'; pathlib.Path('craft/editaja/phase5.patch').write_bytes(out)"
          Copy-Item branding/editaja-logo.png.b64 craft/editaja/editaja-logo.png.b64 -Force
          Copy-Item scripts/apply_branding.py craft/editaja/apply_branding.py -Force

      - name: Reconstruct and verify corresponding source
        shell: pwsh
        run: |
          git clone https://github.com/KDE/kdenlive.git corresponding-source
          git -C corresponding-source checkout $env:UPSTREAM_COMMIT
          git -C corresponding-source apply --ignore-space-change -p2 "$env:GITHUB_WORKSPACE\craft\editaja\phase5.patch"
          python scripts/apply_branding.py corresponding-source --assets branding
          if (-not (Select-String -Path corresponding-source/src/main.cpp -Pattern 'i18n\("Edit Aja"\)' -Quiet)) {
            throw 'Edit Aja branding verification failed'
          }
          if (-not (Test-Path corresponding-source/src/aiassistant/aiassistantwidget.cpp)) {
            throw 'Phase 5 AI assistant source is missing'
          }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Remove-Item -Recurse -Force corresponding-source/.git
          Compress-Archive -Path corresponding-source/* -DestinationPath artifacts/Edit-Aja-Source.zip -CompressionLevel Optimal

      - name: Install KDE Craft with MinGW x64
        shell: pwsh
        run: |
          # Craft warns about host sh/gcc leaking into its environment. Keep Git's
          # cmd shim, but remove the Unix/host MinGW tool directories for bootstrap.
          $env:PATH = (($env:PATH -split ';') | Where-Object {
            $_ -and
            $_ -notmatch '(?i)\\Git\\bin
      - name: Install Edit Aja Craft blueprint
        shell: pwsh
        run: |
          $kdenliveFile = Get-ChildItem "$env:CRAFT_ROOT" -File -Recurse -Filter kdenlive.py -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'kdemultimedia[\\/]kdenlive[\\/]kdenlive\.py$' } |
            Select-Object -First 1
          if (-not $kdenliveFile) { throw 'Could not locate the Kdenlive Craft blueprint' }
          $target = Join-Path $kdenliveFile.Directory.Parent.FullName 'editaja'
          New-Item -ItemType Directory -Force $target | Out-Null
          Copy-Item craft/editaja/* $target -Recurse -Force
          Write-Host "Edit Aja blueprint: $target"
          Get-ChildItem $target

      - name: Build and package Edit Aja
        shell: pwsh
        run: |
          . "$env:CRAFT_ROOT\craft\craftenv.ps1"
          craft --package kde/kdemultimedia/editaja

      - name: Collect Windows package and Craft logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $packages = Get-ChildItem "$env:CRAFT_ROOT\tmp" -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Extension -in '.exe','.zip','.7z' -and
              ($_.Name -match 'edit.?aja' -or $_.Name -match 'editaja')
            }
          foreach ($p in $packages) {
            Copy-Item $p.FullName (Join-Path 'artifacts' $p.Name) -Force
          }
          $logs = Get-ChildItem "$env:CRAFT_ROOT" -Directory -Recurse -Filter logs -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($logs) {
            Compress-Archive -Path "$($logs.FullName)\*" -DestinationPath artifacts/Craft-logs.zip -Force
          }
          Get-ChildItem artifacts -File | Format-Table Name, Length

      - name: Upload Edit Aja artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Edit-Aja-Windows-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
 -and
            $_ -notmatch '(?i)\\Git\\usr\\bin
      - name: Install Edit Aja Craft blueprint
        shell: pwsh
